name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build split-ABI release APKs
        run: ./gradlew assembleRelease -PabiSplits --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            case "$base" in
              *arm64*)   abi="arm64-v8a";;
              *armeabi*) abi="armeabi-v7a";;
              *x86_64*)  abi="x86_64";;
              *)         abi="universal";;
            esac
            cp "$f" "dist/RadioFm-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RadioFm ${{ github.ref_name }}
          body: |
            分架构安装包：
            - arm64-v8a：现代手机（推荐）
            - armeabi-v7a：老旧 32 位设备
            - x86_64：模拟器 / 平板
            - universal：全架构通用
          files: dist/*.apk
          fail_on_unmatched_files: true
