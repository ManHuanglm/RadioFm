name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/radiofm-release.keystore

      - name: Build split-ABI release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PabiSplits --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            case "$base" in
              *arm64*)   abi="arm64-v8a";;
              *armeabi*) abi="armeabi-v7a";;
              *x86_64*)  abi="x86_64";;
              *)         abi="universal";;
            esac
            cp "$f" "dist/RadioFm-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RadioFm ${{ github.ref_name }}
          body: |
            分架构安装包：
            - arm64-v8a：现代手机（推荐）
            - armeabi-v7a：老旧 32 位设备
            - x86_64：模拟器 / 平板
            - universal：全架构通用
          files: dist/*.apk
          fail_on_unmatched_files: true
